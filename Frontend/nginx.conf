# Serves the built app and forwards /api to the API container.
# The app and the API must share an origin: the login cookie is SameSite=Strict, so a browser
# never sends it on a call to another origin (the same reason Vite proxies /api in development).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Screens like /groceries or /bills are routes inside the app, not files: serve the app for them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
